<script>
const c=document.getElementById('c'),g=c.getContext('2d'),RW=640,RH=400,MW=36,MH=28,M=[];
g.imageSmoothingEnabled=false;
for(let y=0;y<MH;y++)M.push(Array(MW).fill('.'));
const Rc=(x,y,w,h,k='#')=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)M[j][i]=k};
// '#' concreto · 'W' tijolo (borda) · 'B' caixote · 'M' container · 'a'/'b' placas dos sites
[[0,0,MW,1,'W'],[0,MH-1,MW,1,'W'],[0,0,1,MH,'W'],[MW-1,0,1,MH,'W'],[8,3,2,6],[8,19,2,6],[26,3,2,6],[26,19,2,6],[12,4,5,3,'M'],[12,21,5,3,'M'],[20,5,3,3,'B'],[20,20,3,3,'B'],[16,12,4,4,'M'],[14,10,2,1,'B'],[20,17,2,1,'B'],[11,9,1,4,'B'],[24,15,1,4,'B'],[29,3,1,2,'B'],[33,6,1,2,'B'],[29,23,1,2,'B'],[33,20,1,2,'B']].forEach(a=>Rc(...a));
M[5][35]='a';M[22][35]='b';
const S=[{n:'A',x:31,y:5,r:3.3},{n:'B',x:31,y:22,r:3.3}],solid=(x,y)=>M[y|0]?.[x|0]!='.';

/* ===== ARMAS / ECONOMIA =====
   cost: preço · dmg/hs: dano corpo/cabeça (por projétil) · cd: tempo entre tiros · mag: pente · rl: recarga
   pel: projéteis por tiro · spr/mspr: dispersão parado/andando · zs: multiplicador de dispersão com zoom
   rc: recuo · zoom: escala de FOV ao mirar (menor = mais zoom) · st: barras da loja
   fo: queda de dano com a distância [distância sem perda, perda por metro, mínimo] */
const WD={
 pistol:{n:'PISTOLA',cost:100,dmg:30,hs:90,cd:.2,mag:12,rl:1.2,pel:1,spr:.006,mspr:.035,zs:.5,rc:7,zoom:.38,f:170,fo:[12,.02,.6],st:[.35,.65,.5,.5]},
 shotgun:{n:'SHOTGUN',cost:200,dmg:15,hs:30,cd:.85,mag:6,rl:2,pel:8,spr:.065,mspr:.085,zs:.7,rc:16,zoom:.38,f:70,fo:[2.5,.1,.15],st:[.9,.25,.2,.3]},
 sniper:{n:'SNIPER',cost:300,dmg:105,hs:200,cd:1.3,mag:5,rl:2.4,pel:1,spr:.002,mspr:.05,zs:1,rc:20,zoom:.2,f:45,fo:[99,0,1],st:[1,.1,1,.2]}};
const WL=['pistol','shotgun','sniper'],START_MONEY=100,REW=50,SHOP={x0:30,w:180,gap:20,y:92,h:240,btn:{x:210,y:346,w:220,h:40}};

/* ===== TEXTURAS PROCEDURAIS DAS PAREDES ===== */
let sd=7;const rnd=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
function tex(fn){const t=document.createElement('canvas');t.width=t.height=64;fn(t.getContext('2d'));return t}
function grain(x,n,col,a){x.fillStyle=col;for(let i=0;i<n;i++){x.globalAlpha=a*(.4+rnd()*.6);x.fillRect(rnd()*64|0,rnd()*64|0,1+(rnd()*2|0),1+(rnd()*2|0))}x.globalAlpha=1}
function conc(x,v){x.fillStyle='#737b88';x.fillRect(0,0,64,64);
 for(let r=0;r<3;r++){const y=r*21,o=r%2?16:48;x.fillStyle='#4d5460';x.fillRect(0,y,64,1);x.fillRect(o,y,1,21);x.fillRect((o+32)%64,y,1,21);x.fillStyle='#8b93a1';x.fillRect(0,y+1,64,1)}
 x.fillStyle='#8d95a3';x.fillRect(0,0,64,3);x.fillStyle='#4a505b';x.fillRect(0,57,64,7);x.fillStyle='#3d424b';x.fillRect(0,57,64,1);
 grain(x,160,'#2e333b',.5);grain(x,90,'#a9b1be',.4);
 if(v==1){x.fillStyle='#22262d';x.fillRect(18,18,28,18);x.fillStyle='#5b6270';for(let k=0;k<5;k++)x.fillRect(19,20+k*3.4,26,1.4);x.fillStyle='#8b93a1';x.fillRect(17,17,30,1);x.fillRect(17,36,30,1)}
 if(v==2){x.fillStyle='#e8c230';x.fillRect(20,15,24,18);x.fillStyle='#111';x.fillRect(20,15,24,2);x.fillRect(20,31,24,2);x.font='bold 16px sans-serif';x.textAlign='center';x.fillText('!',32,29)}}
function brick(x){x.fillStyle='#4a3f3a';x.fillRect(0,0,64,64);
 for(let r=0;r<7;r++){const y=r*8,off=r%2?0:8;for(let b=-1;b<5;b++){const s=rnd()*30|0;x.fillStyle=`rgb(${122+s},${72+(s*.5|0)},${58+(s*.4|0)})`;x.fillRect(b*16+off+1,y+1,14,6)}}
 x.fillStyle='#e8c230';x.fillRect(0,57,64,7);x.fillStyle='#111';for(let k=-8;k<64;k+=16){x.beginPath();x.moveTo(k,64);x.lineTo(k+8,64);x.lineTo(k+16,57);x.lineTo(k+8,57);x.fill()}
 grain(x,120,'#000',.35)}
function crate(x){x.fillStyle='#9c6c3a';x.fillRect(0,0,64,64);
 for(let p=0;p<4;p++){x.fillStyle='#6e4a26';x.fillRect(p*16,0,1,64)}
 grain(x,140,'#4d331a',.5);grain(x,60,'#c79a62',.4);
 x.fillStyle='#6e4a26';x.fillRect(0,0,64,5);x.fillRect(0,59,64,5);x.fillRect(0,0,5,64);x.fillRect(59,0,5,64);
 x.strokeStyle='#4d331a';x.lineWidth=7;x.beginPath();x.moveTo(5,5);x.lineTo(59,59);x.stroke();
 x.strokeStyle='#8a5f33';x.lineWidth=4;x.beginPath();x.moveTo(5,5);x.lineTo(59,59);x.stroke();
 x.fillStyle='#2b2013';[[2,2],[60,2],[2,60],[60,60]].forEach(p=>x.fillRect(p[0],p[1],2,2))}
function cont(x){for(let i=0;i<64;i+=4){x.fillStyle=(i/4)%2?'#2f7f86':'#3b9199';x.fillRect(i,0,4,64);x.fillStyle='#1f5359';x.fillRect(i+3,0,1,64)}
 x.fillStyle='#1d4e53';x.fillRect(0,0,64,5);x.fillRect(0,59,64,5);
 x.fillStyle='#d9d9d9';x.fillRect(10,26,26,6);x.fillStyle='#1d4e53';for(let k=0;k<6;k++)x.fillRect(12+k*4,28,2,2);
 x.fillStyle='#b8b8b8';x.fillRect(46,20,2,24);x.fillRect(52,20,2,24);grain(x,70,'#7a4a2a',.5)}
function sgn(x,l){x.fillStyle='#262d38';x.fillRect(0,0,64,64);x.strokeStyle='#ffdc50';x.lineWidth=3;x.strokeRect(3,3,58,58);x.fillStyle='#ffdc50';x.font='bold 46px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(l,32,34);grain(x,60,'#000',.4)}
const TX={c:[0,1,2].map(v=>tex(x=>conc(x,v))),B:tex(crate),W:tex(brick),M:tex(cont),a:tex(x=>sgn(x,'A')),b:tex(x=>sgn(x,'B'))};
function texFor(ch,mx,my){if(ch=='B')return TX.B;if(ch=='W')return TX.W;if(ch=='M')return TX.M;if(ch=='a')return TX.a;if(ch=='b')return TX.b;return TX.c[[0,1,0,0,2,0][(mx*5+my*7)%6]||0]}
// mapa de oclusão do chão (escurece perto das paredes)
const AO=new Uint8Array(MW*MH);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(M[y][x]=='.'){let m=0;if(solid(x-1,y))m|=1;if(solid(x+1,y))m|=2;if(solid(x,y-1))m|=4;if(solid(x,y+1))m|=8;AO[y*MW+x]=m}
const FL=g.createImageData(RW,RH);FL.data.fill(255);
const VG=g.createRadialGradient(RW/2,RH/2,RH*.35,RW/2,RH/2,RH*.95);VG.addColorStop(0,'rgba(0,0,0,0)');VG.addColorStop(1,'rgba(0,0,0,.5)');
const gc=document.createElement('canvas');gc.width=RW;gc.height=RH;const gx=gc.getContext('2d');

let U=[],P=null,spike={},st='menu',phase='play',pt=0,tm=100,round=1,score=[0,0],K={},down=0,zoomOn=0,zb=[],msgT=0,msg='',sens=.0022,mxn=.5,mIn=false,AC,shopMsg=null,FX=[];
let cap=false,lockFail=false;
function setCap(on){cap=on;c.classList.toggle('cap',on);document.documentElement.classList.toggle('cap',on);
 if(on&&!document.fullscreenElement)try{const f=c.requestFullscreen&&c.requestFullscreen();if(f&&f.catch)f.catch(()=>{})}catch(e){}
 if(!on&&document.fullscreenElement)try{document.exitFullscreen()}catch(e){}
 if(on){lockFail=false;try{const p=c.requestPointerLock({unadjustedMovement:true});if(p&&p.catch)p.catch(()=>{try{c.requestPointerLock()}catch(e){}})}catch(e){try{c.requestPointerLock()}catch(e2){}}msgShow('Mouse capturado — M para liberar',1.6)}
 else{if(document.pointerLockElement==c)document.exitPointerLock();msgShow('Mouse liberado',1)}}
function releaseLock(){cap=false;c.classList.remove('cap');document.documentElement.classList.remove('cap');if(document.pointerLockElement==c)try{document.exitPointerLock()}catch(e){}}
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement==c)lockFail=false;else if(cap&&!lockFail){cap=false;c.classList.remove('cap');document.documentElement.classList.remove('cap')}});
document.addEventListener('pointerlockerror',()=>{lockFail=true});
function snd(f,d,v,n){try{AC=AC||new AudioContext();const o=AC.createOscillator(),q=AC.createGain(),t=AC.currentTime;o.type=n?'sawtooth':'square';o.frequency.setValueAtTime(f,t);if(n)o.frequency.exponentialRampToValueAtTime(30,t+d);q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
function cast(x,y,dx,dy){dx=dx||1e-9;dy=dy||1e-9;let mx=x|0,my=y|0,ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),sx,sy,sdx,sdy,side=0;
 if(dx<0){sx=-1;sdx=(x-mx)*ddx}else{sx=1;sdx=(mx+1-x)*ddx}if(dy<0){sy=-1;sdy=(y-my)*ddy}else{sy=1;sdy=(my+1-y)*ddy}
 for(let i=0;i<80;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(solid(mx,my))break}
 const d=side?sdy-ddy:sdx-ddx;let wx=side?x+d*dx:y+d*dy;return[d,side,wx-Math.floor(wx),M[my]?.[mx],mx,my]}
function mv(e,dx,dy,sp,dt){const r=.25,nx=e.x+dx*sp*dt,ny=e.y+dy*sp*dt,a=Math.sign(dx)*r,b=Math.sign(dy)*r;
 if(!solid(nx+a,e.y)&&!solid(nx+a,e.y+r)&&!solid(nx+a,e.y-r))e.x=nx;if(!solid(e.x,ny+b)&&!solid(e.x+r,ny+b)&&!solid(e.x-r,ny+b))e.y=ny}
function path(sx,sy,tx,ty){const prev=new Int16Array(MW*MH).fill(-1),q=[sy*MW+sx],T=ty*MW+tx;prev[q[0]]=-2;
 for(let i=0;i<q.length;i++){const n=q[i];if(n==T)break;const x=n%MW,y=n/MW|0;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(y+b)*MW+x+a;if(prev[k]==-1&&M[y+b][x+a]=='.'){prev[k]=n;q.push(k)}}}
 if(prev[T]==-1)return null;let n=T,p=n;while(prev[n]>=0){p=n;n=prev[n]}return{x:p%MW+.5,y:(p/MW|0)+.5}}
const inSite=u=>S.find(s=>Math.hypot(u.x-s.x,u.y-s.y)<s.r);
const mku=(x,y,t,site,hold)=>({x,y,t,a:t?Math.PI:0,hp:100,alive:1,cd:0,fl:0,react:0,s:1,site,hold,act:0,want:0,ammo:25,rl:0,pt:0,nx:null});
const SKINS=[[226,180,146],[198,146,108],[150,104,76],[240,205,175]];
const SPAWN_DEF=[[31.5,12.5,[30.5,6.5]],[31.5,15.5,[32.5,3.5]],[29.5,13.5,[30.5,21.5]],[29.5,16.5,[32.5,24.5]]];
// H: -1 bot · 0 jogador local/host · 1,2 convidados remotos. occ = quais vagas humanas estão ocupadas
function layout(mode,occ){
 if(mode=='x1')return[{t:0,x:3.5,y:13.5,site:0,H:0},{t:1,x:31.5,y:13.5,site:0,H:1}];
 const L=[[3.5,13.5],[3.5,11.5],[3.5,15.5]].map((p,i)=>({t:0,x:p[0],y:p[1],site:i==2?1:0,H:occ[i]?i:-1}));
 SPAWN_DEF.forEach(d=>L.push({t:1,x:d[0],y:d[1],site:0,hold:{x:d[2][0],y:d[2][1]},H:-1}));return L}
function setupRound(sp,my){const o=P,k=o?.kills||0,ult=o?.ult||0;
 U=sp.map((s,i)=>{const u=mku(s.x,s.y,s.t,s.site,s.hold);u.id=i;u.sk=SKINS[i%SKINS.length];u.H=s.H;return u});
 P=Object.assign(U[my],{p:1,pitch:0,rec:0,kick:0,hm:0,hit:0,fs:0,dash:0,reveal:0,q:0,e:0,cv:0,ult,kills:k,bob:0,bobA:0,ps:.66,shake:0,hz:RH/2,trig:0,
  money:o?o.money:START_MONEY,wp:o?o.wp:null,W:o?o.W:{pistol:{own:0,ammo:0},shotgun:{own:0,ammo:0},sniper:{own:0,ammo:0}}});
 WL.forEach(id=>P.W[id].ammo=WD[id].mag);FX=[];
 spike={on:0,t:0,x:0,y:0,prog:0,bt:0};phase='play';tm=100}
function nextRound(first){NET.specs=layout(NET.mode=='x1'?'x1':'coop',NET.occ);setupRound(NET.specs,0);
 if(NET.role=='host')bcast({t:'r',f:first?1:0,rd:round,sc:score,sp:NET.specs});enterShop()}
function enterShop(){st='shop';releaseLock();K={};down=0;zoomOn=0;shopMsg=null;NET.ready=[];NET.shopT=25;NET.sentReady=0;if(!P.wp)P.wp=WL.find(id=>P.W[id].own)||null}
function beginRound(){st='play';down=0;zoomOn=0;if(NET.role){cap=false;msgShow('Clique na tela para capturar o mouse',3)}else setCap(true)}
function shopReady(){if(NET.role=='host'){NET.ready[0]=1;checkGo()}else if(NET.role=='client'){if(!NET.sentReady){NET.sentReady=1;sendHost({t:'rd'})}}else beginRound()}
function start(){score=[0,0];round=1;P=null;nextRound(1)}
const msgShow=(t,s)=>{msg=t;msgT=s||1.5};
function shopBuy(id){const d=WD[id],w=P.W[id],say=t=>shopMsg={t,u:performance.now()+1800};
 if(w.own){P.wp=id;snd(300,.08,.1);say(d.n+' equipada');return}
 if(P.money<d.cost){say('Créditos insuficientes para '+d.n);snd(80,.2,.2,1);return}
 P.money-=d.cost;w.own=1;P.wp=id;snd(700,.12,.15);say(d.n+' comprada!')}
function shopClick(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*RW/r.width,y=(e.clientY-r.top)*RH/r.height,B=SHOP.btn;
 if(x>=B.x&&x<=B.x+B.w&&y>=B.y&&y<=B.y+B.h){shopReady();return}
 if(y>=SHOP.y&&y<=SHOP.y+SHOP.h)WL.forEach((id,i)=>{const cx=SHOP.x0+i*(SHOP.w+SHOP.gap);if(x>=cx&&x<=cx+SHOP.w)shopBuy(id)})}
function reward(by,hs){by.kills++;by.ult=Math.min(2,by.ult+1);by.money+=REW;msgShow((hs?'ABATE — HEADSHOT!':'ABATE!')+'  +'+REW+'c',1.4);snd(900,.1,.12)}
function hurt(t,d,by,hs){if(!t.alive)return;t.hp-=d;if(t.p){t.hit=.3;t.shake=.25}
 if(t.hp<=0){t.alive=0;t.act=0;if(by.p)reward(by,by.hs);else if(by.H>0)sendTo(by.H,{t:'k',hs:hs?1:0});if(t.p)msgShow('VOCÊ FOI ELIMINADO',3)}}
function end(w,t){if(phase!='play')return;score[w]++;msgShow((w?'DEFENSORES VENCEM: ':'ATACANTES VENCEM: ')+t,3.4);bcast({t:'e',sc:score,m:msg});phase='end';pt=3.5}

/* ===== PROJEÇÃO + PERSONAGEM EM PARTES =====
   O boneco é uma lista de partes (retângulos/elipses em coordenadas u,v de 0 a 1 dentro do sprite).
   A MESMA lista é usada para desenhar e para testar o tiro — o tiro só acerta o que está desenhado sob a mira. */
const VW=.38*RW/2;
function proj(e){const rx=e.x-P.x,ry=e.y-P.y,dx=Math.cos(P.a),dy=Math.sin(P.a),px=-dy*P.ps,py=dx*P.ps,det=px*dy-py*dx,a=(rx*dy-ry*dx)/det,b=(px*ry-py*rx)/det;if(b<=.2)return null;
 const zf=.66/P.ps,h=RH/b*zf,w=VW/(b*P.ps),sx=RW/2*(1+a/b);
 return{b,sx,h,w,x0:sx-w/2,T:P.hz-h*.35,H:h*.85,zf}}
const TR={b:[168,42,56],d:[74,22,34],a:[255,170,180]},TA={b:[44,160,148],d:[18,66,70],a:[150,255,240]};
function parts(e,pr,ghost){
 const sh=Math.max(.35,1/(1+pr.b*.1)),fr=Math.cos(e.a)*(P.x-e.x)+Math.sin(e.a)*(P.y-e.y)>0,sw=Math.sin((e.x+e.y)*5),
  C=e.t!=P.t?TR:TA,B=C.b,D=C.d,A=C.a,SK=e.sk||SKINS[0],BK=[30,30,34],GN=[22,24,28],
  col=(c,m=1)=>ghost?'#ff4655':e.fl>0?`rgb(${230*sh|0},${230*sh|0},${230*sh|0})`:`rgb(${c[0]*sh*m|0},${c[1]*sh*m|0},${c[2]*sh*m|0})`,
  L=[],add=(u0,u1,v0,v1,c,m,o)=>L.push(Object.assign({u0,u1,v0,v1,f:col(c,m||1)},o)),
  le=.94+.025*sw,re=.94-.025*sw;
 // pernas, joelheiras e botas
 add(.31,.49,.60,.80,D,.9);add(.31,.49,.80,le-.06,D,.8);add(.32,.48,.74,.80,B,.7);add(.29,.50,le-.06,le,BK);
 add(.51,.69,.60,.80,D,.9);add(.51,.69,.80,re-.06,D,.8);add(.52,.68,.74,.80,B,.7);add(.50,.71,re-.06,re,BK);
